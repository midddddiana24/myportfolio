    <!-- Geist fonts self-hosted (Claude Code's exact font) -->
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/geist-sans/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('/fonts/geist-mono/GeistMono-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <!-- Anti-FOIC -->
    <script>
      ;(function(){
        const s = localStorage.getItem('rm-theme')
        const d = window.matchMedia('(prefers-color-scheme: dark)').matches
        const dark = s ? s === 'dark' : d
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
