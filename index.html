    <meta property="og:title" content="Roberto Mediana Jr. — Full-Stack Developer" />
    <meta property="og:description" content="BSIT Student · Full-Stack Developer · Web Penetration Tester · WVSU Janiuay" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rmjdev.vercel.app/" />
    <meta property="og:site_name" content="Roberto Mediana Jr." />
    <!-- Raster, not the SVG: X, Facebook, LinkedIn, Slack and Discord all
         refuse to render SVG link previews, so an svg og:image means no card
         at all. Dimensions are declared so scrapers can lay out before fetch. -->
    <meta property="og:image" content="https://rmjdev.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roberto Mediana Jr. — Full-Stack Developer and Web Penetration Tester, WVSU Janiuay Campus." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://rmjdev.vercel.app/og-image.png" />
    <meta name="theme-color" content="#f8f8f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      Four faces, four jobs. One request, so they resolve in a single round trip.
        Anton         — every heading on the site, h1 through h6, plus the
                        hero name and the watermark numerals. Ships a single
                        weight; see .hero-name for why that matters
                        (font-weight:700 would fake a bolder Anton).
        DM Sans       — all body copy. Chosen because it is the designed
                        sibling of the DM Mono already in use, so the labels
                        and the prose share a voice instead of being two
                        unrelated sans faces sitting next to each other.
        DM Mono       — eyebrows, labels, data.

        Space Grotesk was dropped here, not merely unused: it had been
        carrying every heading on the pages below the hero, and once Anton
        took those over the five weights being downloaded had no consumer
        left. Loading a family nothing references is the one part of this
        redesign a visitor could measure.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Person","name":"Roberto Mediana Jr.","jobTitle":"Full-Stack Developer","url":"https://rmjdev.vercel.app","alumniOf":{"@type":"EducationalOrganization","name":"West Visayas State University – Janiuay Campus"}}
    </script>

    <!--
      The pre-paint ground. This rule runs before React mounts, so it is what a
      visitor stares at during the first request — and it must match the app's
      own ground or the load opens with a flash of the wrong colour.

      It said #0a0a0a until the palette inversion, under a comment claiming
      "dark-only theme, no FOUC needed". Both halves stopped being true at the
      same moment: the theme is paper-first now, and a black html background
      under a paper app is not the absence of a flash, it IS the flash — every
      cold load painted black and then snapped to white. The rule is cheap
      insurance and worth keeping; it just has to agree with --bg-base.
    -->
    <style>html { background: #f8f8f8; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
