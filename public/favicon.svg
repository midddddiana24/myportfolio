<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Opaque ground, not a tint: the glyphs are white now, so a near-
       transparent background would leave them invisible against a light
       browser tab bar. Dark ground works in both light and dark chrome. -->
  <rect width="32" height="32" fill="#0a0a0a"/>
  <text x="4" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-weight="700" font-size="13" fill="#f0f0f0" letter-spacing="-0.5">RM</text>
  <circle cx="27" cy="26" r="2.5" fill="#ffffff"/>
</svg>
